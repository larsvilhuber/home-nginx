# Shared caching directives for every MusicBrainz-facing location (symlinked as /etc/nginx/snippets/musicbrainz-cache-common.conf).
# Used by musicbrainz-location.conf (browser apps, :8081 /mb/) and the ARM listener in musicbrainz-proxy.conf (:8083 /ws/2/).
proxy_cache mb;
proxy_cache_key $request_uri;
proxy_cache_lock on;                          # identical concurrent requests share one upstream call
proxy_cache_valid 200 30d;                    # releases/barcodes almost never change
proxy_cache_valid 404 1h;
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;
proxy_read_timeout 120s;                      # may wait in the 1 req/s queue
add_header X-Cache $upstream_cache_status always;
