# MusicBrainz caching + rate-limiting proxy.  Install as /etc/nginx/conf.d/musicbrainz-proxy.conf
# (see nginx/README.md).  Lives at http{} level.
#
# Layout:  browser -> /mb/ on :8081 (cache) --miss--> 127.0.0.1:8082 (1 req/s queue) -> musicbrainz.org
# The queue sits behind the cache so cache hits are never delayed.

proxy_cache_path /var/cache/nginx-mb levels=1:2 keys_zone=mb:20m max_size=2g inactive=90d use_temp_path=off;

# One outbound request per second, queued (not rejected), as MusicBrainz asks.
limit_req_zone $server_name zone=mb_out:64k rate=1r/s;

server {
    listen 127.0.0.1:8082;
    server_name _;

    location / {
        limit_req zone=mb_out burst=200;          # waits its turn instead of failing
        proxy_pass https://musicbrainz.org/ws/2/;
        proxy_ssl_server_name on;
        proxy_set_header Host musicbrainz.org;
        proxy_set_header User-Agent "home-nginx-cdcheck/1.0 (https://github.com/larsvilhuber/home-nginx)";
        proxy_set_header Accept "application/json";
        proxy_set_header Cookie "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
