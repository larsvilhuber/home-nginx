# Include inside the 127.0.0.1:8081 server block:   include /etc/nginx/snippets/musicbrainz-location.conf;
# Same-origin, cached MusicBrainz web service for /cdcheck.html and /review.html:  /mb/release/?query=...
location /mb/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_cache mb;
    proxy_cache_key $request_uri;
    proxy_cache_lock on;                          # identical concurrent requests share one upstream call
    proxy_cache_valid 200 30d;                    # releases/barcodes almost never change
    proxy_cache_valid 404 1h;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_ignore_headers Cache-Control Expires Set-Cookie;
    proxy_hide_header Set-Cookie;
    proxy_read_timeout 120s;                      # may wait in the 1 req/s queue
    add_header X-Cache $upstream_cache_status always;
}
