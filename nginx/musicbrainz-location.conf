# Include inside the 127.0.0.1:8081 server block:   include /etc/nginx/snippets/musicbrainz-location.conf;
# Same-origin, cached MusicBrainz web service for /cdcheck.html and /review.html:  /mb/release/?fmt=json&query=...
location /mb/ {
    proxy_pass http://127.0.0.1:8082/;
    include /etc/nginx/snippets/musicbrainz-cache-common.conf;
}
