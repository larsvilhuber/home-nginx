<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Media tools</title>
<link rel="stylesheet" href="vendor/fontawesome-6.7.2/css/all.min.css">
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --mut:#6b6b76; --card:#f3f3f6; --acc:#2457d6; --bar:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#ececf1; --mut:#9a9aa6; --card:#1e1e22; --acc:#7ea2ff; --bar:#18181b; }
  }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  [hidden] { display:none !important; }

  /* compact top bar: menu button, where you are, and (wide screens) icon tabs */
  header { flex:none; display:flex; align-items:center; gap:8px; min-width:0;
           padding:6px max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left)); padding-top:max(6px, env(safe-area-inset-top));
           background:var(--bar); border-bottom:1px solid #8883; position:relative; z-index:5; }
  header h1 { flex:1; min-width:0; margin:0; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header h1 a { color:inherit; text-decoration:none; }
  header h1 .here { color:var(--mut); font-weight:600; }
  header h1 .here i { color:var(--acc); margin:0 5px 0 2px; }
  .hbtn, .tabs a, .ext a { font:inherit; border:0; border-radius:8px; background:var(--card); color:var(--fg); text-decoration:none; cursor:pointer;
                           display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .hbtn { flex:none; width:44px; height:44px; justify-content:center; font-size:1.15rem; }
  .hbtn[aria-current=page], .tabs a[aria-current=page] { background:var(--acc); color:#fff; }
  .tabs, .ext { display:none; gap:4px; }
  .tabs a { padding:9px 12px; }
  .ext a { padding:9px 11px; font-size:.9rem; }
  .fa-arrow-up-right-from-square { font-size:.7em; opacity:.7; }
  @media (min-width:820px) { .tabs { display:flex; } }
  @media (min-width:1180px) { .ext { display:flex; } }

  main { flex:1; position:relative; min-height:0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; }
  iframe.on { display:block; }

  /* full-screen menu of big icon buttons (the start page, and what the menu button returns to) */
  #menu { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; background:var(--bg);
          padding:16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .grid { max-width:760px; margin:0 auto; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; }
  @media (min-width:600px) { .grid { grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; } }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:128px; padding:14px 10px;
          border-radius:16px; background:var(--card); color:var(--fg); text-decoration:none; text-align:center;
          border:2px solid transparent; -webkit-tap-highlight-color:transparent; }
  .tile:hover, .tile:focus-visible { border-color:var(--acc); outline:none; }
  .tile:active { transform:scale(.98); }
  .tile > i:first-child { font-size:2.1rem; color:var(--acc); margin-bottom:2px; }
  .tile .name { font-weight:700; font-size:1.08rem; }
  .tile .desc { color:var(--mut); font-size:.8rem; line-height:1.25; }
  .tile[aria-current=page] { border-color:var(--acc); }
  .grid.small .tile { min-height:72px; flex-direction:row; gap:10px; }
  .grid.small .tile > i:first-child { font-size:1.3rem; margin:0; color:var(--mut); }
  .grid.small .tile .name { font-size:.95rem; font-weight:600; }
  #menu h2 { max-width:760px; margin:22px auto 10px; font-size:.8rem; font-weight:600; color:var(--mut); text-transform:uppercase; letter-spacing:.05em; }
</style>
</head>
<body>
<header>
  <a class="hbtn" href="/" target="_top" aria-label="Hibou" title="Back to Hibou"><img src="/icons/owl.svg" alt="" style="width:1.3em;height:1.3em"></a>
  <a class="hbtn" id="home" href="#" aria-label="Menu" title="Menu"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i></a>
  <h1><a href="#">Media tools</a><span class="here" id="here"></span></h1>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="ext" id="ext"></div>
</header>
<main id="views">
  <section id="menu" aria-label="Menu">
    <div class="grid" id="grid"></div>
    <h2>Elsewhere</h2>
    <div class="grid small" id="gridext"></div>
  </section>
</main>
<script>
// Sections. Pages load relative to this one (so a worktree copy of the hub shows its own pages).
// tabbed: the page has CD | DVD tabs; #check/dvd picks one, and the page reports its tab back.
const VIEWS = [
  { id:'play',    label:'Play',       icon:'fa-circle-play',     src:'play.html',    desc:'Scan a CD or DVD to play it' },
  { id:'check',   label:'Check',      icon:'fa-barcode',         src:'check.html',   desc:'Is it in the library?', tabbed:true },
  { id:'tag',     label:'Tag',        icon:'fa-tag',             src:'tag.html',     desc:'Codes, DVD import, labels', tabbed:true },
  { id:'catalog', label:'Cataloguer', icon:'fa-book-open',       src:'catalog.html', desc:'Add anything to Shelf' },
  { id:'labels',  label:'Shelf labels', icon:'fa-print',         src:'shelflabels.html', desc:'Print Shelf labels on the labeller' },
  { id:'review',  label:'Review',     icon:'fa-clipboard-check', src:'review.html',  desc:'Check MusicBrainz tags' },
  { id:'help',    label:'Help',       icon:'fa-circle-question', src:'help.html',    desc:'What to do, step by step', iconOnly:true },
];
const EXT = [
  { label:'CD Ripper',      icon:'fa-compact-disc', href:'http://hibou:8086/' },
  { label:'Squeeze server', icon:'fa-music',        href:'http://hibou:9000/' },
];
// old section names (bookmarks, links in older pages) -> [section, tab]
const LEGACY = {
  cdplay:['play'], dvdplay:['play'],
  cdcheck:['check', 'cd'], dvdcheck:['check', 'dvd'],
  cdtag:['tag', 'cd'], dvdtag:['tag', 'dvd'],
  catalogue:['catalog'], cataloguer:['catalog'], shelflabels:['labels'], menu:[''], home:[''],
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const frames = {};
let CUR = '';

function parseHash(h) {                     // "check/dvd" -> { v, tab:'dvd' }; "" or unknown -> { v:null } = menu
  let [id, tab] = String(h || '').replace(/^#/, '').toLowerCase().split('/');
  if (LEGACY[id]) { const m = LEGACY[id]; id = m[0]; tab = m[1] || tab; }
  const v = VIEWS.find(x => x.id === id) || null;
  return { v, tab: v && v.tabbed && /^(cd|dvd)$/.test(tab || '') ? tab : '' };
}
function setHash(h) { try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch {} }
function mark(el, on) { if (on) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current'); }

function show(hash) {
  const { v, tab } = parseHash(hash);
  CUR = v ? v.id : '';
  if (v && !frames[v.id]) {                 // load on first visit, then keep alive (camera, queues, drafts)
    const f = document.createElement('iframe');
    f.src = v.src + '?embed=1' + (tab ? '&tab=' + tab : ''); f.title = v.label; f.allow = 'camera; clipboard-write; screen-wake-lock';
    $('views').append(f); frames[v.id] = f;
  } else if (v && tab) {                    // already loaded: ask it to switch tabs
    try { frames[v.id].contentWindow.postMessage({ type:'media-set-tab', tab }, location.origin); } catch {}
  }
  for (const k in frames) frames[k].classList.toggle('on', k === CUR);
  $('menu').hidden = !!v;
  document.querySelectorAll('[data-view]').forEach(a => mark(a, a.dataset.view === CUR));
  mark($('home'), !v);
  $('here').innerHTML = v ? ` · <i class="fa-solid ${v.icon}" aria-hidden="true"></i>${esc(v.label)}` : '';
  document.title = 'Media tools' + (v ? ' · ' + v.label : '');
  setHash(v ? v.id + (tab ? '/' + tab : '') : '');
  if (!v) $('menu').scrollTop = 0;
}

// menu tiles, wide-screen tabs, outside links
$('grid').innerHTML = VIEWS.map(v => `<a class="tile" href="#${v.id}" data-view="${v.id}"><i class="fa-solid ${v.icon}" aria-hidden="true"></i>
  <span class="name">${esc(v.label)}</span><span class="desc">${esc(v.desc)}</span></a>`).join('');
// iconOnly: just the icon in the wide-screen tab row (keeps the row short); the menu tile has the name
$('tabs').innerHTML = VIEWS.map(v => v.iconOnly
  ? `<a href="#${v.id}" data-view="${v.id}" title="${esc(v.label)}" aria-label="${esc(v.label)}"><i class="fa-solid ${v.icon}" aria-hidden="true"></i></a>`
  : `<a href="#${v.id}" data-view="${v.id}"><i class="fa-solid ${v.icon}" aria-hidden="true"></i>${esc(v.label)}</a>`).join('');
const extLink = (e, cls) => `<a${cls ? ` class="${cls}"` : ''} href="${esc(e.href)}" target="_blank" rel="noopener"><i class="fa-solid ${e.icon}" aria-hidden="true"></i>
  <span class="name">${esc(e.label)}</span><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></a>`;
$('gridext').innerHTML = EXT.map(e => extLink(e, 'tile')).join('');
$('ext').innerHTML = EXT.map(e => extLink(e, '')).join('');
// "#" links (menu button, title): hashchange does not fire for an empty hash, so route them here
document.querySelectorAll('a[href="#"]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(''); }));

addEventListener('hashchange', () => show(location.hash));
// a tabbed page reports its tab: keep the address in step (#check/dvd), so a reload or bookmark returns there
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'media-tab') return;
  const v = VIEWS.find(x => x.tabbed && x.id === e.data.page && frames[x.id] && e.source === frames[x.id].contentWindow);
  if (v && CUR === v.id && /^(cd|dvd)$/.test(e.data.tab)) setHash(v.id + '/' + e.data.tab);
});
show(location.hash);
</script>
</body>
</html>
