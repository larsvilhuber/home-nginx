<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVD Check</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --mut:#6b6b76; --card:#f3f3f6; --ok:#1b7f3b; --no:#b3261e; --warn:#9a6700; --acc:#2457d6; --unk:#7a7a85; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#ececf1; --mut:#9a9aa6; --card:#1e1e22; --ok:#4cc26b; --no:#ff6b61; --warn:#e3b341; --acc:#7ea2ff; --unk:#8a8a96; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  h2 { font-size:1.05rem; margin:22px 0 6px; }
  .sub { color:var(--mut); font-size:.85rem; margin-bottom:12px; }
  video { width:100%; max-height:40vh; background:#000; border-radius:10px; display:none; object-fit:cover; }
  .row { display:flex; gap:8px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:0; padding:10px; font-size:1rem; border:1px solid var(--mut); border-radius:8px; background:var(--bg); color:var(--fg); }
  button { padding:10px 14px; font-size:1rem; border:0; border-radius:8px; background:var(--acc); color:#fff; }
  button.sec { background:var(--card); color:var(--fg); }
  button.sm { padding:6px 10px; font-size:.85rem; }
  button:disabled { opacity:.45; }
  .card { background:var(--card); border-radius:10px; padding:12px; margin:10px 0; }
  .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-weight:600; font-size:.85rem; color:#fff; }
  .have { background:var(--ok); } .miss { background:var(--no); } .maybe { background:var(--warn); } .unk { background:var(--unk); }
  .t { font-weight:600; } .m { color:var(--mut); font-size:.85rem; word-break:break-all; }
  #status { color:var(--mut); font-size:.9rem; min-height:1.3em; }
  #status.bad { color:var(--no); } #status.ok { color:var(--ok); }
  .chk { display:flex; gap:8px; padding:6px 0; border-top:1px solid #8884; align-items:flex-start; }
  .chk:first-of-type { border-top:0; }
  .chk .dot { flex:none; width:1.3em; text-align:center; font-weight:700; }
  .chk.ok .dot { color:var(--ok); } .chk.no .dot { color:var(--no); } .chk.unk .dot { color:var(--unk); }
  pre { white-space:pre-wrap; word-break:break-word; font-size:.8rem; background:var(--bg); padding:8px; border-radius:8px; max-height:200px; overflow:auto; }
  .item { padding:8px 0; border-top:1px solid #8884; display:flex; gap:10px; align-items:center; cursor:pointer; }
  .item:first-child { border-top:0; } .item > div { flex:1; min-width:0; }
  html.embed h1, html.embed .sub { display:none; }
</style>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed');</script>
</head>
<body>
<main>
  <h1>DVD Check</h1>
  <div class="sub">Scan a film's barcode (or LV label) to check that its file, Jellyfin list entry, links and Jellyfin item are all in place.</div>

  <video id="cam" playsinline muted></video>
  <div class="row">
    <button id="scan">Scan barcode</button>
    <button id="stop" class="sec" style="display:none">Stop</button>
  </div>
  <form class="row" id="manual">
    <input type="text" id="code" autocapitalize="characters" autocomplete="off" placeholder="or type barcode / LV code">
    <button>Check</button>
  </form>
  <div id="status"></div>
  <div id="out"></div>

  <h2>Film records</h2>
  <div class="card" id="list"><span class="m">Loading…</span></div>
</main>

<script>
const API = '/cdcheck-api/';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const status = (t, cls) => { $('status').textContent = t; $('status').className = cls || ''; };
const canon = c => { c = String(c || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase(); return c.length === 13 && /^0\d+$/.test(c) ? c.slice(1) : c; };
const fmtSize = n => n == null ? '' : n >= 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(0) + ' MB';
let CUR = '', busy = false, lastCode = '', lastAt = 0;

async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, { method, cache:'no-store', headers: body ? { 'Content-Type':'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, j };
}

// One checklist row: ok true = green, false = red, null/undefined = grey (unknown).
function line(label, c) {
  if (!c) return '';
  const cls = c.ok === true ? 'ok' : c.ok === false ? 'no' : 'unk';
  const dot = c.ok === true ? '✓' : c.ok === false ? '✗' : '?';
  let det = c.detail || '';
  if (label === 'File') det = [c.path, c.size != null ? fmtSize(c.size) : '', det].filter(Boolean).join(' · ');
  else if (label === 'List row') det = [(c.rows || []).map(r => 'line ' + r.line + (r.version ? ' [' + r.version + ']' : '')).join(', '), det].filter(Boolean).join(' · ');
  else if (label === 'Symlink') det = [(c.links || []).map(l => l.link.split('/').slice(-2).join('/')).join(', '), det].filter(Boolean).join(' · ');
  else if (label === 'Jellyfin') det = c.ok === null ? 'Jellyfin unreachable. ' + det : [c.id ? 'id ' + c.id : '', c.resolved ? 'resolved ' + c.resolved : '', det].filter(Boolean).join(' · ');
  return `<div class="chk ${cls}"><span class="dot">${dot}</span><div><b>${label}</b><div class="m">${esc(det)}</div></div></div>`;
}
function meta(rec) {
  if (!rec) return '';
  const bits = [rec.kind, rec.status, rec.year, rec.creator, rec.catno && 'cat ' + rec.catno, rec.notes].filter(Boolean);
  return `<div class="m">${esc(bits.join(' · '))}</div>`;
}

async function check(raw) {
  const code = canon(raw); if (!code) return;
  CUR = code; busy = true;
  try {
    status('Checking ' + code + '…');
    const { ok, status: st, j } = await api('video/check/' + encodeURIComponent(code));
    if (st === 404) { $('out').innerHTML = ''; status(code + ': ' + (j.error || 'unknown barcode') + '. Nothing is catalogued under this code.', 'bad'); return; }
    if (!ok) throw new Error(j.error || 'HTTP ' + st);
    const rec = j.record || {};
    let html = `<div class="card"><div class="t">${esc(rec.title || code)}</div>${meta(rec)}<div class="m">${esc(code)}</div>`;
    if (!j.films || !j.films.length) {
      html += `<div style="margin-top:8px">${esc(j.message || 'no film files recorded for this code')}</div></div>`;
      status(code + ': ' + (j.message || 'no films'), j.kind === 'cd' ? '' : 'bad');
    } else {
      const sum = j.all_ok === true ? '<span class="badge have">all OK</span>' : j.all_ok === false ? '<span class="badge miss">problems found</span>' : '<span class="badge unk">unknown</span>';
      html += `<div style="margin-top:6px">${sum} <span class="m">${j.playable ? 'playable' : 'not playable'}${j.saved ? ' · saved ' + esc(j.saved) : ''}</span></div></div>`;
      for (const f of j.films) {
        html += `<div class="card"><div class="t">${esc(f.title || 'Film ' + (f.index + 1))} ${f.ok === true ? '<span class="badge have">OK</span>' : f.ok === false ? '<span class="badge miss">fix</span>' : '<span class="badge unk">?</span>'}</div>
          <div class="m">${esc(f.movie_path || '')}</div>
          ${line('File', f.file_exists)}${line('List row', f.tsv_row)}${line('Symlink', f.symlink_ok)}${line('Jellyfin', f.jellyfin_id_ok)}</div>`;
      }
      status(code + ': ' + (j.all_ok === true ? 'all checks passed.' : j.all_ok === false ? 'some checks failed. Try "Rebuild + rescan".' : 'some checks could not be made.'), j.all_ok === true ? 'ok' : j.all_ok === false ? 'bad' : '');
    }
    html += `<div class="row"><button id="rebuild" class="sec">Rebuild + rescan</button><button id="recheck" class="sec">Re-check</button></div><div id="rbout"></div>`;
    $('out').innerHTML = html;
    $('rebuild').onclick = rebuild; $('recheck').onclick = () => check(CUR);
  } catch (e) { status('Error: ' + e.message, 'bad'); lastAt = 0; }
  finally { busy = false; }
}
async function rebuild() {
  const b = $('rebuild'); b.disabled = true; $('rbout').innerHTML = '<div class="m">Rebuilding the Jellyfin list and rescanning (can take a while)…</div>';
  try {
    const { ok, status: st, j } = await api('video/rebuild', 'POST', {});
    const bld = j.build || {};
    if (!ok || !bld.ok || (j.refresh && !j.refresh.ok)) {
      $('rbout').innerHTML = `<div class="card"><b style="color:var(--no)">Rebuild ${!ok || !bld.ok ? 'failed' : 'ran, but the Jellyfin rescan failed'}</b> (HTTP ${st})
        <pre>${esc([j.error, bld.stdout, bld.stderr, j.refresh && j.refresh.error].filter(Boolean).join('\n'))}</pre></div>`;
      b.disabled = false; return;
    }
    status('Rebuilt. Waiting a moment for Jellyfin to pick up the change…');
    await new Promise(r => setTimeout(r, 3000));
    await check(CUR);
  } catch (e) { $('rbout').innerHTML = `<div class="m" style="color:var(--no)">Error: ${esc(e.message)}</div>`; b.disabled = false; }
}
$('manual').onsubmit = e => { e.preventDefault(); check($('code').value); $('code').value = ''; };

// ---------- film records ----------
async function loadList() {
  try {
    const kinds = ['dvd', 'bluray', 'vhs'];
    const rs = await Promise.all(kinds.map(k => api('items?kind=' + k).catch(() => ({ ok:false, j:[] }))));
    const items = rs.flatMap(r => Array.isArray(r.j) ? r.j : []).sort((a, b) => String(a.title).localeCompare(String(b.title)));
    $('list').innerHTML = items.length ? items.map(i => `<div class="item" data-code="${esc(i.code)}"><div><div class="t">${esc(i.title)}</div>
      <div class="m">${esc(i.code)} · ${esc(i.kind)}${i.play && i.play.system ? ' · plays on ' + esc(i.play.system) : ' · catalogue only'}</div></div><button class="sm sec">Check</button></div>`).join('')
      : '<span class="m">No film records yet.</span>';
  } catch (e) { $('list').innerHTML = '<span class="m">Could not load: ' + esc(e.message) + '</span>'; }
}
$('list').addEventListener('click', e => { const i = e.target.closest('[data-code]'); if (i) { check(i.dataset.code); scrollTo({ top: 0, behavior: 'smooth' }); } });

// ---------- camera ----------
let stream = null, timer = null, wake = null;
async function startScan() {
  if (stream) return;
  if (!window.isSecureContext) { status('Camera needs HTTPS (open https://hibou/).', 'bad'); return; }
  let Det = window.BarcodeDetector;
  if (!Det) {
    try {
      status('Loading barcode decoder…');
      await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = '/vendor/barcode-detector-3.2.3.js'; s.onload = ok; s.onerror = bad; document.head.appendChild(s); });
      BarcodeDetectionAPI.setZXingModuleOverrides({ locateFile: (f, prefix) => f.endsWith('.wasm') ? '/vendor/zxing_reader.wasm' : prefix + f });
      Det = BarcodeDetectionAPI.BarcodeDetector;
    } catch (e) { status('Could not load barcode decoder. Type the digits instead.', 'bad'); return; }
  }
  let fmts = ['ean_13', 'upc_a', 'ean_8', 'upc_e', 'code_39', 'code_128', 'itf', 'codabar'];
  try { const sup = await Det.getSupportedFormats(); fmts = fmts.filter(f => sup.includes(f)); } catch {}
  const det = new Det({ formats: fmts });
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (e) { status('Camera error: ' + e.message, 'bad'); return; }
  const v = $('cam'); v.srcObject = stream; v.style.display = 'block'; await v.play();
  $('scan').style.display = 'none'; $('stop').style.display = '';
  try { wake = await navigator.wakeLock?.request('screen'); } catch {}
  status('Point the camera at the barcode…');
  timer = setInterval(async () => {
    if (busy) return;
    try {
      const codes = await det.detect(v);
      if (codes.length) {
        const c = canon(codes[0].rawValue);
        if (c === lastCode && Date.now() - lastAt < 6000) return;
        lastCode = c; lastAt = Date.now();
        if (navigator.vibrate) navigator.vibrate(60);
        check(c);
      }
    } catch {}
  }, 250);
}
function stopScan() {
  clearInterval(timer); timer = null;
  if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  try { wake?.release(); } catch {} wake = null;
  $('cam').style.display = 'none'; $('scan').style.display = ''; $('stop').style.display = 'none';
}
$('scan').onclick = startScan; $('stop').onclick = () => { stopScan(); status(''); };
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });

loadList();
const pre = new URLSearchParams(location.search).get('code') || location.hash.slice(1);
if (pre && /^[A-Za-z0-9]+$/.test(pre)) check(pre);
</script>
</body>
</html>
