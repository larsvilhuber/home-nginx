<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVD Check</title>
<!-- Moved (step 13): this page is now check.html?tab=dvd. Kept so bookmarks and links keep working; query string and hash are carried over. -->
<script>
(function () {
  var p = new URLSearchParams(location.search), q = new URLSearchParams();
  q.set('tab', 'dvd');
  p.forEach(function (v, k) { if (k !== 'tab' || !q.has('tab')) q.append(k, v); });
  var h = location.hash.slice(1);                       // dvdcheck.html#LV00101 -> &code=LV00101
  if (h && !q.has('code') && /^[A-Za-z0-9]+$/.test(h)) q.set('code', h);
  var s = q.toString();
  location.replace('check.html' + (s ? '?' + s : ''));
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=check.html?tab=dvd"></noscript>
<style>body { font:16px/1.4 system-ui,sans-serif; padding:16px; } @media (prefers-color-scheme: dark) { body { background:#121214; color:#ececf1; } a { color:#7ea2ff; } }</style>
</head>
<body>
<p>DVD Check has moved to <a href="check.html?tab=dvd">check.html?tab=dvd</a>.</p>
</body>
</html>
