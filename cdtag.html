<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD Tag</title>
<!-- Moved (step 13): this page is now tag.html?tab=cd. Kept so bookmarks and links keep working; query string and hash are carried over. -->
<script>
(function () {
  var p = new URLSearchParams(location.search), q = new URLSearchParams();
  q.set('tab', 'cd');
  p.forEach(function (v, k) { if (k !== 'tab' || !q.has('tab')) q.append(k, v); });
  var s = q.toString();
  location.replace('tag.html' + (s ? '?' + s : '') + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=tag.html?tab=cd"></noscript>
<style>body { font:16px/1.4 system-ui,sans-serif; padding:16px; } @media (prefers-color-scheme: dark) { body { background:#121214; color:#ececf1; } a { color:#7ea2ff; } }</style>
</head>
<body>
<p>CD Tag has moved to <a href="tag.html?tab=cd">tag.html?tab=cd</a>.</p>
</body>
</html>
